<header><h1>여행 체력 지도 — 프로토타입</h1><p>여행 전: 일정을 담으면 하루 체력 요약이 뜨고, 힘든 곳이 몰려 있으면 순서 변경을 제안해요. 장소를 누르면 체력 카드와 덜 힘든 방법을 볼 수 있어요.

여행 중: 지금 장소의 체력 정보를 확인하고, 지치면 &#x27;쉴 곳 찾기&#x27;로 근처 벤치·실내·화장실을 찾아요.

여행 후: 한 탭 평가가 체력 카드에 쌓여요.

워치: 장소에 도착하면 체력 카드 요약이 뜨고, 버튼 하나로 가장 가까운 쉴 곳을 찾아 진동으로 안내받아요.</p></header>
