<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한 탭 체감 평가</title>
<script src="./support.js"></script>
<style>html{background:#E9E4DA}body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
a{color:#3D3D3A}a:hover{color:#1F1F1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 28px; background: #F6F6F4; color: #1F1F1F; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 13px; color: #5F5F5A">오늘 다녀온 곳</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.35">포로 로마노<br>어땠어요?</h1>
<div style="font-size: 14px; color: #5F5F5A; line-height: 1.5">남겨주신 평가는 다음 여행자의 체력 카드에 반영돼요.</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
</sc-for>
</div>
<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 14px; color: #1B6B43; font-weight: 500">고마워요. 평가가 반영됐어요.</div>
</sc-if>
<a href="PhoneUpdated.dc.html" style="margin-top: auto; height: 48px; border-radius: 24px; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center">건너뛰기</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || null;
const base = 'height: 60px; border-radius: 16px; font-size: 17px; font-weight: 700; text-align: left; padding: 0 20px; ';
const mk = (id, label) => ({
label: label,
style: base + (picked === id ? 'border: 2px solid #2B5FD9; background: #E8EEFC; color: #1F47A8' : 'border: 1px solid #DEDED9; background: #FFFFFF; color: #1F1F1F'),
pick: () => this.setState({ picked: id })
});
return {
done: picked !== null,
opts: [mk('easy', '생각보다 편했어요'), mk('same', '예상과 비슷했어요'), mk('hard', '생각보다 힘들었어요')]
};
}
}
</script>
</body>
</html>
